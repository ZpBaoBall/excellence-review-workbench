# 卓越绩效评审工作台 · 主配置
# 本文件是「唯一事实来源」：工作台程序 与 zp-评审工作台路由 Skill 共用同一份，
# 规矩只写一次，不会出现「程序说放 A、Skill 说放 B」。

程序:
  名称: 卓越绩效评审工作台
  版本: v0.2
  端口: 8765
  代码目录: E:/个人/质量管理平台/卓越绩效
  数据目录: E:/个人/质量管理平台/卓越绩效/data
  交换区:
    outbox: E:/个人/质量管理平台/卓越绩效/exchange/outbox
    inbox: E:/个人/质量管理平台/卓越绩效/exchange/inbox
  备份目录: E:/个人/质量管理平台/卓越绩效/backup

vault:
  根: E:/个人/ZpBaoball
  名称: ZpBaoball
  说明: .obsidian 仅在根这一层，01/02/03 是同一 vault 下的子库

库:
  社会兼职:
    路径: E:/个人/ZpBaoball
    落点:
      # 内容类（存 md，Obsidian 管理）：按模块建功能分库
      条款与心得: 笔记/Exp
      资料评审库: 政府质量奖-资料评审库
      现场评审库: 政府质量奖-现场评审库
      质量模式库: 政府质量奖-质量模式库
      AI工具: 工具/AI工具
      模板: 工具/模板
      # 台账与字典已内置平台（data/ledger.json / dicts.json），不再存 md
      # 报告输出：报告正文落政府质量奖子库 20-资料评审库/
      报告输出: 政府质量奖-资料评审库

# ── 模块扩展接口 ────────────────────────────────────────────
# 工作台按「模块」划分业务线。当前只开政府质量奖，其余先登记不开通。
# 以后要接入新业务线，三步即可（扫描建档已下线，不再有「扫描源」）：
#   ① 在下面「登记」里加一段（说明 + 奖项枚举，状态标「预留」）
#   ② 把该模块名加进「启用」列表
#   ③ 在 data/dicts.json 的「类别」字典里补该业务线的类别行（模块列填同名）
# 台账 / 图表 / 类别下拉均按「启用」模块过滤，无需改代码。
模块:
  启用:
    - 政府质量奖

  登记:
    政府质量奖:
      说明: 上海市及各区政府质量奖（组织类）的评审、孵化、培训
      奖项枚举:
        - 上海市政府质量奖
        - 上海市市长质量奖
        - 上海市质量金奖
        - 区政府质量奖
        - 区长质量奖
        - 质量奖-个人
      状态: 启用
    首席质量官:
      说明: 首席质量官奖评审与辅导
      奖项枚举:
        - 首席质量官奖
      状态: 预留
    先进管理办法:
      说明: 先进质量管理模式典型案例评审
      奖项枚举:
        - 先进质量管理模式
      状态: 预留
    单项创新:
      说明: 创新单项奖评价
      奖项枚举:
        - 创新单项奖
      状态: 预留
    质量攻关:
      说明: 重点产品质量攻关项目入库与评价
      奖项枚举:
        - 质量攻关项目
      状态: 预留

字段:
  必填:
    - id
    - 企业名称
    - type
    - 模块
    - 年份
    - 区域
    - 行业
    - 类别
    - "奖项/项目"
    - 阶段
    - 结论
    - 状态
  选填:
    - 适用标准
    - 得分
    - 企业规模
    - 首次参评
    - 管理模式名称
    - 评审角色
    - 现场日期
    - 报告日期
    - 相关笔记
    - 标签

# 政策库字段枚举（改这里即可，界面下拉同步生效）
政策枚举:
  层级: [国家级, 市级, 区级, 园区, 其他]
  政策类型: [法律, 法规, 规章, 规划, 实施方案, 行动计划, 扶持办法, 奖励办法, 通知意见, 标准, 其他]
  来源类型: [政府网站, 政府公报, 标准原文, 新闻, 行业媒体, 二手转述]
  时效状态: [现行有效, 即将失效, 已失效, 已修订, 未生效, 待确认]
  时效提示天数: 90        # 距失效不足这么多天就标「即将失效」
  复核提醒天数: 180       # 超过这么多天没复核就提示

枚举:
  阶段: [文审中, 报告已出, 现场中, 归档]
  结论: [推荐, 不推荐, 获奖, 未获奖, 孵化中, 待定]
  状态: [active, archived]
  企业规模: [大型, 中型, 小型, 微型]
  评审角色: [组长, 组员]

# ── 条款归位（Word 提取后，优势/建议段落回填条款号用）────────────
# 用户 2026-10-24 定：Word 里不写条款号，提取时输入回填；4.4 必须落细项。
# 「关键词」用于按小标题文本模糊匹配默认值（猜中用户确认、猜空手工选）。
条款归位:
  清单:
    - {号: "4.1", 名: "领导", 关键词: [领导, 高层, 组织治理, 社会责任, 文化, 价值观, 使命, 愿景]}
    - {号: "4.2", 名: "战略", 关键词: [战略, 发展战略, 战略部署, 规划, 目标, 竞争优势, 部署]}
    - {号: "4.3", 名: "顾客与市场", 关键词: [顾客, 市场, 客户, 满意, 投诉, 需求, 细分]}
    - {号: "4.4.1", 名: "人力资源", 关键词: [人力, 人才, 员工, 培训, 绩效, 薪酬, 招聘, 继任, 满意]}
    - {号: "4.4.2", 名: "财务资源", 关键词: [财务, 资金, 预算, 成本, 资本]}
    - {号: "4.4.3", 名: "信息和知识资源", 关键词: [信息, 知识, 数据, 信息化, 系统, 档案]}
    - {号: "4.4.4", 名: "技术资源", 关键词: [技术, 研发, 创新, 专利, 工艺, 产学研]}
    - {号: "4.4.5", 名: "基础设施", 关键词: [基础设施, 设备, 厂房, 设施, 运维, 安全环保, 信息化设施]}
    - {号: "4.4.6", 名: "相关方关系", 关键词: [相关方, 供应商, 合作, 伙伴, 协作, 治理关系]}
    - {号: "4.4.7", 名: "供应网络", 关键词: [供应, 供应链, 采购, 物流, 外协]}
    - {号: "4.5", 名: "过程管理", 关键词: [过程, 流程, 过程管理, 设计开发, 质量控制, 改进]}
    - {号: "4.6", 名: "测量、分析与改进", 关键词: [测量, 分析, 改进, 绩效监视, 审核, 评审, 对标, 创新管理]}

# ── 适用标准（政府质量奖各适用准则，忽略年份）────────────────
# 「适用标准」字段枚举。编号去斜杠+缩写，与条款库文件名前缀一致，
# 平台扫描条款库时按此匹配关联（见「标准库」段）。
适用标准:
  - "GBT19580 卓越"      # GB/T 19580 卓越绩效评价准则（组织类）
  - "DB31T1153 医疗"     # DB31/T 1153 医疗机构卓越绩效评价准则
  - "DB31T1009 小企业"   # DB31/T 1009 小企业卓越绩效评价准则
  - "DB31T598 个人"      # DB31/T 598 政府质量奖个人评价准则

# ── 标准条款库（笔记/Exp）────────────────
# 一条款一 md，平铺存放。文件名自含「标准+条款」，全库唯一，双链无歧义。
# 命名：{去斜杠编号}-{缩写}-{条款号}{条款名}.md，例：GBT19580-卓越-4.1领导.md
# 标准↔编号↔缩写对照见「适用标准」段（编号去斜杠即文件名前缀）。
标准库:
  目录: 笔记/Exp
  命名: "{去斜杠编号}-{缩写}-{条款号}{条款名}.md"
  粒度: 子条款      # 条款库只存「过程主题的子条款」，大条款不单独建文件
  类目映射表:        # 前端按条款号一级前缀分组，类目名从这里取（键用引号防 yaml 把 4.1 当数字）
    "4.1": 领导
    "4.2": 战略
    "4.3": 顾客与市场
    "4.4": 资源
    "4.6": 测量、分析与改进
  评分项映射表:      # Word 23 评分项 → 15 过程子条款（P3 文审提取归位用，平台 + SKILL 共用）
    # 未列出的 15 个过程子条款（4.1.2~4.6.3）评分项号=条款号，直接原样归，无需映射
    自动归:          # 结果项，明确一一对应，提取时直接归位
      "4.7.2": ["4.3.2", "4.3.3"]      # 产品和服务的结果 → 顾客与市场
      "4.7.3": ["4.3.2", "4.3.3"]      # 顾客与市场的结果 → 顾客与市场
      "4.7.4": ["4.4.3"]               # 财务结果 → 财务资源
      "4.7.5": ["4.4.2", "4.4.4", "4.4.5", "4.4.6", "4.4.7"]  # 资源结果 → 各资源子条款
      "4.7.7": ["4.1.2", "4.1.3", "4.1.4"]  # 领导方面的结果 → 领导子条款
    纠偏:           # 评分表「评分项」编号笔误时，按条款名关键词纠正为标准编号（保留原编号证据）
      "识别与设计": "4.5.2"     # 过程识别与设计（评分表易误写 4.5.1）
      "实施与改进": "4.5.3"     # 过程实施与改进（评分表易误写 4.5.2）
    弹窗判断:        # 横切项，无单一归属，提取时弹窗让用户选归到哪个过程子条款
      - "4.5.2"      # 过程的识别与设计
      - "4.5.3"      # 过程的实施与改进
      - "4.7.6"      # 过程有效性结果
  对应条款格式: "{去斜杠编号}-{缩写}-{条款号}{条款名}"   # = 目标条款文件名去 .md（两处「-」：编号-缩写、缩写-条款号；条款号内部用「.」、条款号与条款名连写不加「-」）
  对应条款填写: 单向填+平台反向   # 只填「主标准→其他标准」单向；反向由平台全库扫「谁指向我」自动生成
  说明: |
    ① 扫描关联：平台扫「标准库.目录」下平铺 md，从文件名解析「标准前缀 + 条款号」，
       与项目「适用标准」字段（去斜杠编号+缩写）匹配，自动建立「项目→标准条款」关联，
       无需手动逐条关联。
    ② 对照查阅：现场评审按项目适用标准默认调取条款；「对照其他标准」入口可切换查看
       其他标准同一条款。跨标准条款对应关系存条款文件 frontmatter 的「对应条款」字段
       （后续整理标准时填写）。
    ③ 条款文件结构（四区）：frontmatter（标准/条款号/条款名/对应条款）+ 正文四区
       「条款原文（过程要求）/ 过程管理要点（4.5 融入）/ 结果（对应 4.7.x）/ 心得」。
       大条款不单独建文件；4.5 过程管理、4.7 结果已按映射并入各过程子条款。
       模板见 80-模板/条款心得模板.md。

# ⚠ 以下「模型 / 检索」两段为【预先登记，尚未接通】——
# 程序当前不发起任何 HTTP 请求，也不读取任何密钥。联网检索靠生成任务包后人工搬运。
# 真要接通时，必须先确认 app/desens.py 的 mask() 已在该调用链上，否则企业名会原文外发。
模型:
  默认供应商: deepseek
  供应商:
    deepseek:
      类型: openai兼容
      接口地址: https://api.deepseek.com/v1
      模型名: deepseek-chat
      密钥环境变量: DEEPSEEK_API_KEY
    claude:
      类型: anthropic
      模型名: claude-sonnet-4-6
      密钥环境变量: ANTHROPIC_API_KEY

检索:
  默认供应商: tavily
  供应商:
    tavily:
      密钥环境变量: TAVILY_API_KEY
    bocha:
      类型: openai兼容
      接口地址: https://api.bochaai.com/v1
      密钥环境变量: BOCHA_API_KEY
  政府站点白名单:
    - gov.cn
    - shanghai.gov.cn
    - miit.gov.cn
    - samr.gov.cn

# ── 脱敏（严格模式）────────────────────────────────────────
# 原则：能不出网就不出网，出网必过闸，过闸必留痕。
# 硬约束写死在 app/desens.py：任何出网函数必须先调 mask()，不提供绕过参数。
# 改词表、档位、规则开关 = 改这里，即时生效，不用动代码。
脱敏:
  启用: true
  级别: 严格             # 严格 / 宽松 / 关闭。严格 = 整篇报告生成不提供出网通道
  审计日志: E:/个人/质量管理平台/卓越绩效/data/desens-audit.log
  代号表: [甲企业, 乙企业, 丙企业, 丁企业, 戊企业, 己企业, 庚企业, 辛企业]
  代号随机: true         # 每次任务重新分配，防止跨任务把同一家企业关联起来
  角色词: [董事长, 总经理, 质量负责人, 技术负责人, 生产负责人, 其他负责人]
  金额档位:              # 单位：万元。命中区间后改成区间表述
    - [0, 1000]          # <1000万
    - [1000, 10000]      # 1000万 – 1亿
    - [10000, 50000]     # 1亿 – 5亿
    - [50000, 200000]    # 5亿 – 20亿
    - [200000, 999999999]# >20亿
  规则:
    企业名称: 代号       # 代号 / 保留 / 删除
    人名: 角色           # 角色 / 删除 / 保留
    地址: 隐藏           # 隐藏（门牌路名换成【地址已脱敏】，区名保留）/ 删除 / 保留
    电话: 删除
    邮箱: 删除
    网址: 删除
    统一社会信用代码: 删除
    证书编号: 删除
    金额: 区间           # 区间 / 删除 / 保留
    客户与供应商名: 代号
  片段上限字数: 3000     # 单次出网超过这个字数直接拒绝，要求拆分后再送
  允许出网场景:          # 只有这些场景允许出网，其余一律本地处理
    - 政策检索
    - 条款校验
    - 文本摘要
  禁止出网场景:          # 材料最多、最难脱干净，只走任务包人工搬运
    - 整篇报告生成

# ── 存储（开源就绪，2026-11-02）────────────────────────────
# json（默认）= data/ledger.json + dicts.json 两个文件，原子写+瞬锁重试；
# sqlite = 单文件 data/workbench.db（documents 表按 key 存 JSON 文档，事务写入）。
# 两种模式读写口径一致，切换后重启生效；写前备份自动跟随（备份目录里的快照都收）。
存储:
  类型: json

安全:
  写入前备份: true
  备份保留份数: 5
